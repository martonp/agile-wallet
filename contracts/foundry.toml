[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
# No solc_version pin: @forshtat/hegota-support needs exactly 0.8.28 and ETHFALCON's falcon8 needs
# 0.8.30 (its IR stack layout), so Foundry picks a compiler per file from the pragmas.
via_ir = true
evm_version = "cancun"
# ETHFALCON's gas figures assume these optimizer settings.
optimizer = true
optimizer_runs = 1000000
# Tests sign with ZKNOX's falcon.js through node, and read the Keccak-f[1600] helper's runtime.
ffi = true
fs_permissions = [
    { access = "read", path = "./lib/ETHFALCON/test" },
    { access = "read-write", path = "./deployments" }, # written by script/Deploy.s.sol
    { access = "read", path = "./out" }, # Deploy.s.sol loads creation code from the artifacts
]
